name: Publish

# A thin caller. The job body — checkout, credentials, the Gradle publication
# and the attestation — is the reusable `publishing.yml` hosted by `config`,
# which the `uses:` line below points at. Keeping the body out of this
# repository is what makes the attestation's signer `config` rather than this
# file (SLSA Build Level 3); the comments in `publishing.yml` explain the
# mechanism.
#
# `CONFIG_COMMIT` is a placeholder, not a ref: `migrate` replaces it on every
# `./config/pull` with the commit of `config` this repository pins as its
# submodule, so the workflow steps and `buildSrc` always come from the same
# commit. It is never edited by hand.
#
# The permission grant is the union of what the two called jobs declare — a
# called workflow can keep or reduce what it is given, never raise it — and
# `secrets: inherit` passes the repository secrets the decryption steps need.

on:
  push:
    branches: [master]

jobs:
  publish:
    name: Publish to Maven repositories
    uses: SpineEventEngine/config/.github/workflows/publishing.yml@fcb80d83931d8a9ce2e12c2f5d485799ad1a2bed
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit
