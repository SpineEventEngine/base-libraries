syntax = "proto3";

package spine.test.code.proto.rejections;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option (SPI_all) = true;
option java_package = "io.spine.test.code.proto.rejections";
// Keep all the rejections under the same outer class called `Rejections`.

// This file defines the test environment for `MessageTypeTest.java`.

// A sample rejection to verify detecting that a message is a rejection from `MessageType`.
message MttSampleRejection {

    Details details = 1;

    message Details {

        string description = 1;
    }
}
