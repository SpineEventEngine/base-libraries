syntax = "proto3";

package spine.test.identifiers;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.test.identifiers";
option java_multiple_files = true;
option java_outer_classname = "IdentifierTestProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";


// Only for usage in `IdentifierTest` class.

message NestedMessageId {
    google.protobuf.StringValue id = 1;
}

message TimestampFieldId {
    google.protobuf.Timestamp id = 1;
}

message SeveralFieldsId {
    string string = 1;
    int32 number = 2;
    google.protobuf.StringValue message = 3;
    int64 long_number = 4;
}

message IdWithPrimitiveFields {
    string name = 1;
    int32 number = 2;
    bool flag = 3;
}

// A message with a single `uuid` field.
message UuidMessage {
    string uuid = 1;
}

// An enum used for testing enum-typed identifiers.
//
// The zero-numbered constant is reserved by convention for the "undefined" value.
enum TaskStatus {
    TASK_STATUS_UNDEFINED = 0;
    TASK_OPEN = 1;
    TASK_CLOSED = 2;
}

// A message with an enum field declared first, for testing enum-typed identifiers.
message EnumFieldId {
    TaskStatus status = 1;
}

// A second enum, of a different type than `TaskStatus`, used to verify that
// an enum ID field is matched by its specific enum type.
enum Priority {
    PRIORITY_UNDEFINED = 0;
    LOW = 1;
    HIGH = 2;
}

// A message with two enum fields of different types, declaring the non-matching
// one first, for testing that an enum ID field is matched by its enum type.
message TwoEnumFieldsId {
    Priority priority = 1;
    TaskStatus status = 2;
}
