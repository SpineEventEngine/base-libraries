syntax = "proto3";

package spine.test.protobuf;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.test.protobuf";
option java_multiple_files = true;
option java_outer_classname = "DescriptorExtsSpecProto";

// This is a message type that contains both nested types and a map field.
//
// Protobuf generates synthetic descriptors for map entry types.
// See https://protobuf.dev/programming-guides/proto3/#maps-features for details.
//
message AddressBook {

    repeated Contact contact = 1;

    message Contact {
        string name = 1;
        repeated PhoneNumber phone = 2;
    }

    message PhoneNumber {
        string value = 1;
    }

    map<string, Contact> recent = 2;
}
